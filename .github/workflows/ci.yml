name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/version.mjs check
      - run: npm install --no-audit --no-fund
      - run: npm test

  # The action itself, on the two test apps: the fixed one passes, the leaky one must fail.
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./
        with:
          path: test/fixtures/fixed
          args: ""
      - id: leaky
        uses: ./
        continue-on-error: true
        with:
          path: test/fixtures/leaky
      - name: The leaky app failed the check
        if: steps.leaky.outcome != 'failure'
        run: exit 1

  # The web page builds, so a change that breaks it shows on the pull request.
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund --ignore-scripts
      - run: npm ci --prefix site --no-audit --no-fund --ignore-scripts
      - run: npm run --prefix site build
